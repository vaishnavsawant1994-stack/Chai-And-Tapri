name: Chai And Tapri CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype-tests:
    name: Browser prototype tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run prototype tests
        working-directory: prototype
        run: node --test *.test.cjs

  backend-tests:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tapri-ci-admin
          POSTGRES_DB: tapri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tapri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply schema and least-privilege grants
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:tapri-ci-admin@127.0.0.1:5432/tapri_ci
        run: |
          node src/migrate.mjs
          PGPASSWORD=tapri-ci-admin psql "$DATABASE_URL" -v database_name=tapri_ci -f ops/runtime-grants.sql
          PGPASSWORD=tapri-ci-admin psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE tapri_ci_runtime LOGIN PASSWORD 'tapri-ci-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT; GRANT chai_tapri_api TO tapri_ci_runtime WITH INHERIT TRUE;"
      - name: Run backend unit and PostgreSQL integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://tapri_ci_runtime:tapri-ci-runtime@127.0.0.1:5432/tapri_ci
          TEST_ADMIN_DATABASE_URL: postgres://postgres:tapri-ci-admin@127.0.0.1:5432/tapri_ci
        run: node --test test/*.test.mjs

  android-checks:
    name: Android JVM tests, APKs, and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run Kotlin tests, build APKs, and lint
        working-directory: android
        run: ./gradlew --no-daemon -PciCompileSdk=36 testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Upload Android build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          if-no-files-found: ignore
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/apk/androidTest/debug/
